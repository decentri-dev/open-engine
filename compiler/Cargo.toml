[package]
name = "compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
open_engine_core = { path = "../core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
alloy = { version = "2.0.4", features = ["serde", "signers", "rpc", "transports"] }

# The compiler library depends only on core; queue and broadcaster are needed
# solely by the integration tests, which exercise the full compile -> queue ->
# broadcast slice.
[dev-dependencies]
open_engine_core = { path = "../core", features = ["test-utils"] }
queue = { path = "../queue" }
broadcaster = { path = "../broadcaster" }
