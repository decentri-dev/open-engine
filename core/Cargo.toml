[package]
name = "open_engine_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
alloy = { version = "2.0.4", features = ["serde", "signers", "rlp", "signer-local", "providers", "transport-http"] }

[features]
# Exposes MockGateway and other in-memory test doubles for downstream test suites.
test-utils = []
# KMS-backed sponsor signers. These only pull in alloy's KMS signer sub-crates so
# the `SponsorSigner` variants can be named/dispatched here; the cloud client SDKs
# needed to *construct* them live in the `api` crate where the factory runs. Off by
# default, so a plain `cargo build` never compiles a cloud SDK.
signer-aws = ["alloy/signer-aws"]
signer-gcp = ["alloy/signer-gcp"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
