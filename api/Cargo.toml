[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
open_engine_core = { path = "../core" }
compiler = { path = "../compiler" }
queue = { path = "../queue" }
broadcaster = { path = "../broadcaster" }
alloy = { version = "2.0.4", features = ["serde", "signers", "rpc", "transports"] }

[dev-dependencies]
# Drives the real router in-process (ServiceExt::oneshot) so the status handler
# is exercised over HTTP without binding a port.
tower = { version = "0.5.3", features = ["util"] }
serde_json = { workspace = true }
# MockGateway, so the broadcaster can run its real completion path without a node.
open_engine_core = { path = "../core", features = ["test-utils"] }

[features]
# Forward KMS sponsor-signer backends to core. The cloud SDKs are pulled in
# transitively via core's alloy KMS features; a default build enables neither.
signer-aws = ["open_engine_core/signer-aws"]
signer-gcp = ["open_engine_core/signer-gcp"]
